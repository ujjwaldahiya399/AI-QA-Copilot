name: AI-QA-Copilot CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Image
              run: docker build -t dahiyaujjwal/ai-qa-copilot:latest .

            - name: login to DockerHub
              run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            - name: Push Image to DockerHub
              run: |
                    docker tag dahiyaujjwal/ai-qa-copilot dahiyaujjwal/dahiyaujjwal/ai-qa-copilot:latest
                    docker push dahiyaujjwal/ai-qa-copilot:latest